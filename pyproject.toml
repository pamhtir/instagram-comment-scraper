[project]
name = "instagram-comment-exporter"
version = "1.1.0"
description = "Portfolio-grade Instagram comment collection and Excel automation"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"
